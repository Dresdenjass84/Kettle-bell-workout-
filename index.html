<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#101216">
<title>Kettlebell Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101216;--card:#1a1d23;--card2:#22262e;--line:#2e333d;--tx:#f3f4f6;--tx2:#a7adb8;--tx3:#6d7480;--acc:#ff7a3d;--acc2:#ffb08a;--work:#c2410c;--rest:#0f766e;--warm:#4338ca;--ready:#a16207;--ok:#34d399;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 96px}
h1{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:30px;margin:4px 0 2px;letter-spacing:.3px}
h2{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:21px;margin:22px 0 10px}
.sub{color:var(--tx2);font-size:15px;margin:0}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);margin:20px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:16px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1b0d05;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .chip{width:100%;min-height:54px;font-size:17px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;background:var(--acc);color:#1b0d05;font-weight:600;font-size:18px;margin-top:22px}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.toggles{display:flex;gap:8px}
.hint{color:var(--tx3);font-size:14px;line-height:1.35;margin:8px 2px 0}
.tog{flex:1;display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px}
.tog i{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:.2s}
.tog i:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tog.on i{background:var(--acc)}.tog.on i:after{left:19px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
.stepper button{width:44px;height:44px;border-radius:10px;background:var(--card2);font-size:22px}
.stepper b{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-size:22px}
.stepper small{display:block;text-align:center;color:var(--tx3);font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#0c0e11ee;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;max-width:190px;padding:10px 0 12px;color:var(--tx3);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 8px}
.sec-h h2{margin:0}.sec-h span{color:var(--tx3);font-size:14px}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 6px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.thumb{width:58px;height:50px;flex:none;background:var(--card2);border-radius:10px}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-weight:600;font-size:16px}
.mrow .nm small{color:var(--tx3);font-size:13px;display:block}
.mrow .nm small.rung{color:var(--acc2);padding-top:3px}
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 8px}
.steps span{padding:5px 12px;border-radius:10px;background:rgba(0,0,0,.22);font-weight:600;font-size:18px;opacity:.6}
.steps span.on{background:#fff;color:#111;opacity:1}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#3a2417;color:var(--acc2);margin-left:6px;vertical-align:2px}
.swap{width:44px;height:44px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.swap svg{width:20px;height:20px}
.simple{padding:7px 4px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-size:15px}
.simple:last-child{border-bottom:0}.simple span:last-child{color:var(--tx3)}
.summary-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{background:var(--card2);border-radius:8px;padding:4px 10px;font-size:14px;color:var(--tx2)}
/* player */
#player{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;transition:background .35s;background:var(--work)}
#player.show{display:flex}
#player.k-work{background:var(--work)}#player.k-rest,#player.k-round,#player.k-set{background:var(--rest)}#player.k-warm,#player.k-cool{background:var(--warm)}#player.k-ready{background:var(--ready)}
.p-top{padding:14px 16px 0;padding-top:max(14px,env(safe-area-inset-top))}
.p-bar{height:6px;background:#0003;border-radius:3px;overflow:hidden}
.p-bar i{display:block;height:100%;background:#fffd;width:0}
.p-meta{display:flex;gap:0;padding-right:70px;font-size:14px;font-weight:600;margin-top:8px;opacity:.92}
.p-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px;min-height:0;text-align:center}
.p-phase{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:24px;letter-spacing:2px;text-transform:uppercase;opacity:.95}
.p-time{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:min(34vw,170px);line-height:.95;font-variant-numeric:tabular-nums}
.p-name{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:min(9vw,40px);line-height:1.05;margin-top:4px}
.p-side{display:inline-block;background:#fff;color:#111;font-weight:700;font-size:15px;border-radius:8px;padding:2px 10px;margin-top:6px;letter-spacing:.5px}
.p-fig{width:min(70vw,330px);height:min(40vh,260px);margin:6px 0;background:#0002;border-radius:18px}
.p-cues{font-size:16px;line-height:1.4;opacity:.95;max-width:430px}
.p-cues div{margin:2px 0}
.p-next{font-size:16px;margin-top:10px;font-weight:600;opacity:.9}
.p-ctrl{display:flex;justify-content:center;align-items:center;gap:22px;padding:14px 16px 22px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.p-ctrl button{width:64px;height:64px;border-radius:50%;background:#0003;display:flex;align-items:center;justify-content:center}
.p-ctrl button.big{width:84px;height:84px;background:#fff;color:#111}
.p-ctrl svg{width:30px;height:30px}
.p-end{position:absolute;right:14px;top:max(26px,calc(env(safe-area-inset-top) + 14px));font-size:14px;font-weight:600;background:#0003;border-radius:10px;padding:8px 12px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-size:24px;margin:0 0 6px}
.bigfig{width:100%;height:230px;background:var(--card2);border-radius:14px;margin:10px 0}
.cue-list{margin:8px 0 0;padding-left:20px;color:var(--tx2)}
.hist{margin-bottom:10px}
.hist .top{display:flex;justify-content:space-between;align-items:baseline}
.hist b{font-size:17px}.hist small{color:var(--tx3)}
.hist p{margin:6px 0 0;color:var(--tx2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;font-size:28px}
.stat small{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.empty{color:var(--tx3);text-align:center;padding:30px 10px}
.hide{display:none!important}
.link{color:var(--tx3);font-size:14px;text-decoration:underline;margin-top:18px;display:block;text-align:center;width:100%}
.done-ico{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#06281c;display:flex;align-items:center;justify-content:center;margin:30px auto 10px}
</style>
</head>
<body>

<div id="v-setup" class="wrap">
  <h1>Kettlebell timer</h1>
  <p class="sub">One 10 kg bell. Timed circuits.</p>

  <div class="lbl">Length</div>
  <div class="chips" id="c-len"></div>

  <div class="lbl">Focus</div>
  <div class="grid2" id="c-focus"></div>

  <div class="lbl">Difficulty</div>
  <div class="chips" id="c-diff"></div>
  <p class="hint" id="diff-hint"></p>

  <div class="lbl">Work / rest</div>
  <div class="chips" id="c-int"></div>
  <div class="row hide" id="custom-int" style="margin-top:8px">
    <div class="stepper"><button data-k="work" data-d="-5">−</button><div><b id="cw">40s</b><small>work</small></div><button data-k="work" data-d="5">+</button></div>
    <div class="stepper"><button data-k="rest" data-d="-5">−</button><div><b id="cr">20s</b><small>rest</small></div><button data-k="rest" data-d="5">+</button></div>
  </div>

  <div class="lbl">Rest between rounds</div>
  <div class="chips" id="c-rr"></div>

  <div class="lbl">Sound</div>
  <div class="toggles">
    <button class="tog" id="t-voice">Voice <i></i></button>
    <button class="tog" id="t-beep">Beeps <i></i></button>
  </div>

  <div class="lbl">Voice during complexes</div>
  <div class="chips" id="c-cxv"></div>
  <p class="hint" id="cxv-hint"></p>

  <button class="btn" id="b-build">Build workout</button>
</div>

<div id="v-preview" class="wrap hide">
  <button class="pill" id="b-back" style="margin-bottom:10px">‹ Back</button>
  <h1 id="pv-title">Workout</h1>
  <div class="summary-line" id="pv-pills"></div>
  <div id="pv-body"></div>
  <div class="row">
    <button class="btn sec" id="b-reshuffle">New mix</button>
    <button class="btn" id="b-start">Start</button>
  </div>
</div>

<div id="v-history" class="wrap hide">
  <h1>History</h1>
  <p class="sub">Saved in this browser on this phone.</p>
  <div class="stats" id="h-stats"></div>
  <div id="h-list" style="margin-top:16px"></div>
  <button class="link" id="b-clear">Clear history</button>
</div>

<div id="v-moves" class="wrap hide">
  <h1>Moves</h1>
  <p class="sub">Tap a move to see it in action.</p>
  <div class="chips" id="m-filter" style="margin-top:14px"></div>
  <div class="card" id="m-list" style="margin-top:12px;padding:4px 8px"></div>
</div>

<div id="v-done" class="wrap hide">
  <div class="done-ico"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
  <h1 style="text-align:center" id="d-title">Workout complete</h1>
  <p class="sub" style="text-align:center" id="d-sub"></p>
  <div class="stats" id="d-stats"></div>
  <h2>Moves done</h2>
  <div class="card" id="d-moves" style="padding:6px 12px"></div>
  <button class="btn" id="b-done">Done</button>
</div>

<nav class="tabs" id="tabs">
  <button data-v="setup" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg>Workout</button>
  <button data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-v="moves"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Moves</button>
</nav>

<div id="player">
  <div class="p-top">
    <div class="p-bar"><i id="p-prog"></i></div>
    <div class="p-meta"><span id="p-where"></span><span id="p-left"></span></div>
  </div>
  <button class="p-end" id="b-end">End</button>
  <div class="p-main">
    <div class="p-phase" id="p-phase">Work</div>
    <div class="p-time" id="p-time">0:40</div>
    <div class="p-name" id="p-name"></div>
    <div><span class="p-side hide" id="p-side"></span></div>
    <svg class="p-fig" id="p-fig" viewBox="0 0 200 190"></svg>
    <div class="p-cues" id="p-cues"></div>
    <div class="p-next" id="p-next"></div>
  </div>
  <div class="p-ctrl">
    <button id="b-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="b-pause" class="big" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" id="ico-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button id="b-next" aria-label="Skip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="box" id="sheet-box"></div></div>

<script>
'use strict';
/* ================= Storage ================= */
const store={get(k,d){try{const v=localStorage.getItem('kb_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('kb_'+k,JSON.stringify(v))}catch(e){}}};

/* ================= Figure engine ================= */
const RAD=Math.PI/180, GROUND=182, CX=100;
const SEG={torso:46,ua:24,fa:22,th:32,sh:32,head:8,neck:14,bell:7};
const ST={t:180,hd:0,na:5,nf:5,fa:-5,ff:-5,nt:0,ns:0,ft:0,fs:0,x:0,y:0,ls:1,ts:1,sw:1,bo:1};
const NUMK=Object.keys(ST);
const D=(a,l)=>[Math.sin(a*RAD)*l,Math.cos(a*RAD)*l];
const add=(p,v)=>[p[0]+v[0],p[1]+v[1]];
function fk(p,view){
  const hip=[0,0], sh=D(p.t,SEG.torso*p.ts), TH=SEG.th*p.ls, SH=SEG.sh*p.ls;
  const head=add(sh,D(p.t+p.hd,SEG.neck));
  let shN=sh,shF=sh,hipN=hip,hipF=hip;
  if(view==='front'){const pp=D(p.t-90,1),w=10*p.sw;shN=add(sh,[pp[0]*w,pp[1]*w]);shF=add(sh,[-pp[0]*w,-pp[1]*w]);hipN=[pp[0]*7,pp[1]*7];hipF=[-pp[0]*7,-pp[1]*7];}
  const elN=add(shN,D(p.na,SEG.ua)), hN=add(elN,D(p.nf,SEG.fa));
  const elF=add(shF,D(p.fa,SEG.ua)), hF=add(elF,D(p.ff,SEG.fa));
  const kN=add(hipN,D(p.nt,TH)), aN=add(kN,D(p.ns,SH));
  const kF=add(hipF,D(p.ft,TH)), aF=add(kF,D(p.fs,SH));
  let tN,tF;
  if(view==='front'){tN=add(aN,[5,1]);tF=add(aF,[-5,1]);}
  else{const o=p.toe?-90:90;tN=add(aN,D(p.ns+o,7));tF=add(aF,D(p.fs+o,7));}
  let bell=null;const b=p.b||'none';
  if(b==='n')bell=add(hN,D(p.nf,SEG.bell));
  else if(b==='f')bell=add(hF,D(p.ff,SEG.bell));
  else if(b==='both'){const m=[(hN[0]+hF[0])/2,(hN[1]+hF[1])/2];bell=add(m,D((p.nf+p.ff)/2,SEG.bell));}
  else if(b==='hip')bell=[hip[0]+2,hip[1]-9];
  const pts={hip,sh,head,shN,shF,hipN,hipF,elN,hN,elF,hF,kN,aN,kF,aF,tN,tF,bell,bh:b==='n'?hN:b==='f'?hF:b==='both'?[(hN[0]+hF[0])/2,(hN[1]+hF[1])/2]:null};
  // ground anchor
  let my=-1e9;const c=(q,r)=>{if(q&&q[1]+r>my)my=q[1]+r;};
  [kN,aN,kF,aF,tN,tF].forEach(q=>c(q,2));[elN,hN,elF,hF].forEach(q=>c(q,3));c(hip,3);c(sh,3);c(head,SEG.head);if(bell)c(bell,SEG.bell);
  const dy=GROUND-my+(p.y||0);
  for(const k in pts){if(pts[k])pts[k]=[pts[k][0]+(p.x||0),pts[k][1]+dy];}
  return pts;
}
function bounds(frames,view){let a=1e9,z=-1e9;frames.forEach(f=>{const q=fk(f[0],view);for(const k in q){if(q[k]){a=Math.min(a,q[k][0]);z=Math.max(z,q[k][0]);}}});return (a+z)/2;}
function lerpPose(A,B,u){const o={};for(const k of NUMK)o[k]=A[k]+(B[k]-A[k])*u;o.b=A.b;o.toe=A.toe;o.view=A.view;return o;}
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
// Draws the figure: tapered limbs, a solid torso, hands, feet and a kettlebell with a handle.
// Far-side limbs sit in a semi-transparent group so overlapping joints don't darken.
function makeFig(svg,opt={}){
  svg.innerHTML='';
  const near=opt.near||'#ffffff', bellC=opt.bell||'#ff7a3d', gc=opt.ground||'rgba(255,255,255,.25)', farOp=opt.farOp||.42;
  el('line',{x1:10,y1:GROUND+1,x2:190,y2:GROUND+1,stroke:gc,'stroke-width':2,'stroke-linecap':'round'},svg);
  const trail=el('polyline',{fill:'none',stroke:bellC,'stroke-width':2.2,'stroke-dasharray':'1 6','stroke-linecap':'round',opacity:0},svg);
  const farG=el('g',{opacity:farOp},svg);
  const seg=(w,par=svg)=>el('line',{stroke:near,'stroke-width':w,'stroke-linecap':'round'},par);
  const dot=(r,par=svg,c=near)=>el('circle',{r,fill:c},par);
  const g={fTh:seg(10,farG),fSh:seg(7.5,farG),fFt:seg(5.5,farG),fUa:seg(7.5,farG),fFa:seg(6,farG),fH:dot(3.6,farG)};
  const fBell=el('g',{},svg);
  g.torso=el('polygon',{fill:near,stroke:near,'stroke-width':5,'stroke-linejoin':'round'},svg);
  g.neck=seg(6);g.head=dot(SEG.head+1.5);
  g.nTh=seg(10);g.nSh=seg(7.5);g.nFt=seg(5.5);
  const nBell=el('g',{},svg);
  g.nUa=seg(7.5);g.nFa=seg(6);g.nH=dot(3.6);
  const bellG=el('g',{},nBell);
  g.handle=el('circle',{r:4.4,fill:'none',stroke:bellC,'stroke-width':2.6},bellG);
  g.bell=el('circle',{r:SEG.bell+.8,fill:bellC},bellG);
  g.base=el('line',{stroke:bellC,'stroke-width':3,'stroke-linecap':'round'},bellG);
  const S=(e,a,b)=>{e.setAttribute('x1',a[0].toFixed(1));e.setAttribute('y1',a[1].toFixed(1));e.setAttribute('x2',b[0].toFixed(1));e.setAttribute('y2',b[1].toFixed(1));};
  const C=(e,a)=>{e.setAttribute('cx',a[0].toFixed(1));e.setAttribute('cy',a[1].toFixed(1));};
  const draw=function(pose,view,cx){
    const q=fk(pose,view);const off=CX-cx;
    for(const k in q){if(q[k])q[k]=[q[k][0]+off,q[k][1]];}
    farG.setAttribute('opacity',view==='front'?1:farOp);
    S(g.fUa,q.shF,q.elF);S(g.fFa,q.elF,q.hF);C(g.fH,q.hF);

const COOL_BY={full:['c_fold','c_quad','c_hipflex','c_chest','c_child','c_cobra','c_knees','c_side'],legs:['c_fold','c_quad','c_hipflex','c_knees','c_child','c_side','c_cobra'],upper:['c_chest','c_child','c_side','c_cobra','c_fold','c_catcow'],core:['c_cobra','c_child','c_knees','c_side','c_catcow','c_fold']};

const ALL={};[...MOVES,...WARM,...COOL].forEach(m=>{m.cx=bounds(m.kf,m.view);ALL[m.id]=m;});
for(const k in UPS)ALL[k].up=UPS[k];

/* ================= Workout generator ================= */
const TEMPLATE={
  full:['ballistic','squat','push','pull','core','lunge','hinge','ballistic','push','core'],
  legs:['squat','hinge','lunge','ballistic','squat','hinge','lunge','squat'],
  upper:['push','pull','arms','ballistic','push','pull','arms','push'],
  core:['flex','antiext','rot','carry','ballistic','antiext','flex','rot']
};
const COREPATS=['flex','antiext','rot','carry'];
const matches=(m,tok)=>tok==='core'?COREPATS.includes(m.pat):m.pat===tok;
const BASE={10:[120,60],15:[150,90],20:[180,120],30:[240,150],45:[300,180]};
const READY=10, SET=15;
function recentIds(){const h=store.get('history',[]);const s=new Set();h.slice(0,2).forEach(e=>(e.moves||[]).forEach(id=>s.add(id)));return s;}
function pick(list,recent,boost){
  if(!list.length)return null;
  const w=list.map(m=>(recent.has(m.id)?.12:1)*(boost&&boost(m)?2.5:1));const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i];}return list[list.length-1];
}
function fitPlan(M,W,R,RR,maxSlots,allow,minPer=3){
  let best=null;
  for(let c=1;c<=5;c++)for(let r=1;r<=4;r++)for(let S=c*minPer;S<=Math.min(c*8,maxSlots);S++){
    const D=r*(S*W+(S-c)*R)+(r*c-1)*RR;
    if(D>M+allow)continue;
    const avg=S/c;
    let score=Math.abs(M-D)*.5+(r===3?0:r===2?60:r===4?70:300)+(avg<4?(4-avg)*60:0)+(avg>6?(avg-6)*40:0)+(c-1)*8;
    if(!best||score<best.score)best={c,r,S,D,score};
  }
  if(!best&&minPer>1)return fitPlan(M,W,R,RR,maxSlots,allow,1);
  if(!best)return {c:1,r:1,S:1,D:W,score:0};
  return best;
}
// Difficulty: 'std' repeats the same moves every round; 'hard' climbs one rung of each move's ladder per round;
// 'max' starts one rung up, climbs, and may open with a complex.
const DIFFS=[['std','Standard'],['hard','Hard'],['max','Brutal']];
const basePool=(focus,diff)=>MOVES.filter(m=>(focus==='full'||m.areas.includes(focus))&&(diff==='max'||!m.calls));
function ladderFor(m,rounds,diff,used){
  const ok=id=>id&&!used.has(id);let cur=m;
  if(diff==='max'&&ok(cur.up))cur=ALL[cur.up];
  const out=[cur.id];
  for(let r=1;r<rounds;r++){if(diff!=='std'&&ok(cur.up)&&!out.includes(cur.up))cur=ALL[cur.up];out.push(cur.id);}
  return out;
}
function chooseCircuits(plan,focus,recent,diff){
  const used=new Set(), circuits=[], tpl=TEMPLATE[focus];
  const pool=basePool(focus,diff);
  for(let ci=0;ci<plan.c;ci++){
    const cap=Math.floor(plan.S/plan.c)+(ci<plan.S%plan.c?1:0);
    let filled=0,k=ci*2,guard=0;const moves=[],ladders=[];
    while(filled<cap&&guard++<60){
      const left=cap-filled, tok=tpl[k%tpl.length];k++;
      let cand=pool.filter(m=>!used.has(m.id)&&matches(m,tok)&&(m.uni?2:1)<=left);
      if(!cand.length&&guard>tpl.length)cand=pool.filter(m=>!used.has(m.id)&&(m.uni?2:1)<=left);
      const m=pick(cand,recent,diff==='std'?null:x=>x.up&&!used.has(x.up));if(!m)continue;
      used.add(m.id);const lad=ladderFor(m,plan.r,diff,used);lad.forEach(id=>used.add(id));
      moves.push(lad[0]);ladders.push(lad);filled+=m.uni?2:1;
    }
    circuits.push({moves,ladders,rounds:plan.r});
  }
  return circuits;
}
function buildWorkout(cfg){
  if(!cfg.diff)cfg.diff='hard';
  const T=cfg.mins*60;let [w,c]=BASE[cfg.mins];
  const M=T-w-c-SET-READY;
  const pool=MOVES.filter(m=>cfg.focus==='full'||m.areas.includes(cfg.focus));
  const plan=fitPlan(M,cfg.work,cfg.rest,cfg.rr,pool.reduce((a,m)=>a+(m.uni?2:1),0),Math.min(60,w-90+c-45));
  const recent=recentIds();
  const circuits=chooseCircuits(plan,cfg.focus,recent,cfg.diff).filter(cc=>cc.moves.length);
  // time what was actually filled (the pool can run short), so the total stays exact
  const slotsOf=cc=>cc.moves.reduce((a,id)=>a+(ALL[id].uni?2:1),0);
  plan.c=circuits.length;plan.S=circuits.reduce((a,cc)=>a+slotsOf(cc),0);
  plan.D=circuits.reduce((a,cc)=>a+plan.r*(slotsOf(cc)*cfg.work+(slotsOf(cc)-1)*cfg.rest),0)+(plan.r*plan.c-1)*cfg.rr;
  const diff=M-plan.D; w+=Math.round(diff/2); c+=diff-Math.round(diff/2);
  // warm-up
  const wl=WARM_BY[cfg.focus], nW=Math.max(3,Math.round(w/32));
  const warm=[];for(let i=0;i<nW;i++)warm.push({id:wl[i%wl.length],dur:0});
  spread(warm,w);
  // cool-down
  const cl=COOL_BY[cfg.focus], nC=Math.max(2,Math.round(c/30));const cool=[];let i=0;
  while(cool.length<nC){const m=ALL[cl[i%cl.length]];i++;if(m.uni){if(cool.length+2>nC&&cool.length>0)continue;cool.push({id:m.id,side:'L',dur:0},{id:m.id,side:'R',dur:0});}else cool.push({id:m.id,dur:0});if(i>40)break;}
  spread(cool,c);
  return {cfg,warm,circuits,cool,plan};
}
function spread(arr,total){const b=Math.floor(total/arr.length);let rem=total-b*arr.length;arr.forEach(x=>{x.dur=b+(rem>0?1:0);rem--;});}
function swapMove(wk,ci,idx){
  const cc=wk.circuits[ci], cur=ALL[cc.moves[idx]];
  const used=new Set(wk.circuits.flatMap(c=>c.ladders.flat()));
  const pool=basePool(wk.cfg.focus,wk.cfg.diff).filter(m=>!used.has(m.id)&&m.uni===cur.uni);
  let cand=pool.filter(m=>m.pat===cur.pat||(COREPATS.includes(cur.pat)&&COREPATS.includes(m.pat)));
  if(!cand.length)cand=pool;
  const m=pick(cand,recentIds());if(!m)return;
  cc.ladders[idx].forEach(id=>used.delete(id));used.add(m.id);
  const lad=ladderFor(m,cc.rounds,wk.cfg.diff,used);cc.moves[idx]=lad[0];cc.ladders[idx]=lad;
}
const LETTER='ABCDE';
function sequence(wk){
  const {work,rest,rr}=wk.cfg;const seq=[];
  seq.push({k:'ready',dur:READY,id:wk.warm[0].id});
  wk.warm.forEach((x,i)=>seq.push({k:'warm',dur:x.dur,id:x.id,n:i+1,of:wk.warm.length}));
  seq.push({k:'set',dur:SET});
  wk.circuits.forEach((c,ci)=>{
    for(let r=1;r<=c.rounds;r++){
      const slots=[];c.moves.forEach((id0,mi)=>{const lad=c.ladders?c.ladders[mi]:[id0];const id=lad[Math.min(r-1,lad.length-1)];const m=ALL[id];if(m.uni){slots.push({id,side:'L'},{id,side:'R'});}else slots.push({id});});
      slots.forEach((s,si)=>{
        seq.push({k:'work',dur:work,id:s.id,side:s.side,circ:ci,round:r,rounds:c.rounds});
        const lastSlot=si===slots.length-1;
        if(!lastSlot)seq.push({k:'rest',dur:rest,circ:ci,round:r,rounds:c.rounds});
        else{const lastAll=ci===wk.circuits.length-1&&r===c.rounds;if(!lastAll)seq.push({k:'round',dur:rr,circ:ci,round:r,rounds:c.rounds,newCirc:r===c.rounds,up:r<c.rounds&&!!c.ladders&&c.ladders.some(l=>l[r]!==l[r-1])});}
      });
    }
  });
  wk.cool.forEach((x,i)=>seq.push({k:'cool',dur:x.dur,id:x.id,side:x.side,n:i+1,of:wk.cool.length}));
  // fill in "next" pointers
  for(let i=0;i<seq.length;i++){seq[i].next=seq.slice(i+1).find(s=>s.id)||null;}
  return seq;
}

/* ================= Audio ================= */
let actx=null, voices=[];
function initAudio(){
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{voices=speechSynthesis.getVoices();};}}catch(e){}
}
function beep(freq,dur,vol=.35){
  if(!settings.beep||!actx)return;
  try{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=freq;
    const t=actx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+dur-.04);g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}
}
function say(text,quick){
  if(!settings.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=quick?1.2:1.02;u.lang='en-GB';
    const v=voices.find(v=>v.lang==='en-GB')||voices.find(v=>/^en/.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}

let WK=null;
const FOCUSNAME={full:'Full body',legs:'Legs',upper:'Upper body',core:'Core'};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtMin=s=>{const m=Math.round(s/60);return m+' min';};
function thumbSvg(m){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 200 190');s.setAttribute('class','thumb');staticFig(s,m,{near:'#e9ebef',farOp:.38,ground:'rgba(255,255,255,.15)'});return s;}
const SWAPICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>';
function renderPreview(){
  const wk=WK, c=wk.cfg;
  $('pv-title').textContent=c.mins+' min · '+FOCUSNAME[c.focus];
  $('pv-pills').innerHTML=[c.work+'s work / '+c.rest+'s rest',c.rr+'s between rounds',wk.circuits.length+(wk.circuits.length>1?' circuits':' circuit')+' × '+wk.plan.r+' rounds',DIFFS.find(d=>d[0]===c.diff)[1]].map(t=>'<span class="pill">'+t+'</span>').join('');
  const body=$('pv-body');body.innerHTML='';
  const wsum=wk.warm.reduce((a,x)=>a+x.dur,0)+READY;
  body.insertAdjacentHTML('beforeend','<div class="sec-h"><h2>Warm-up</h2><span>'+fmt(wsum)+'</span></div>');
  const wc=document.createElement('div');wc.className='card';wc.style.padding='4px 12px';
  wk.warm.forEach(x=>wc.insertAdjacentHTML('beforeend','<div class="simple"><span>'+ALL[x.id].name+'</span><span>'+x.dur+'s</span></div>'));body.appendChild(wc);
  wk.circuits.forEach((cc,ci)=>{
    const slots=cc.moves.reduce((a,id)=>a+(ALL[id].uni?2:1),0);
    const dur=cc.rounds*(slots*c.work+(slots-1)*c.rest);
    body.insertAdjacentHTML('beforeend','<div class="sec-h"><h2>Circuit '+LETTER[ci]+' · '+cc.rounds+' rounds</h2><span>~'+fmtMin(dur)+'</span></div>');
    const card=document.createElement('div');card.className='card';card.style.padding='2px 6px';
    cc.moves.forEach((id,idx)=>{
      const m=ALL[id];const row=document.createElement('div');row.className='mrow';
      row.appendChild(thumbSvg(m));
      const nm=document.createElement('div');nm.className='nm';nm.innerHTML='<b>'+m.name+(m.calls?'<span class="tag">Complex</span>':'')+(m.uni?'<span class="tag">L + R</span>':'')+'</b><small>'+(m.uni?'Left then right, '+c.work+'s each':c.work+'s')+'</small>';
      nm.querySelector('b').onclick=nm.querySelector('small').onclick=()=>openMove(m);
      cc.ladders[idx].forEach((rid,ri)=>{if(ri===0||rid===cc.ladders[idx][ri-1])return;const u=ALL[rid];const e=document.createElement('small');e.className='rung';e.textContent='Round '+(ri+1)+': '+u.name;e.onclick=()=>openMove(u);nm.appendChild(e);});
      row.appendChild(nm);
      const sw=document.createElement('button');sw.className='swap';sw.setAttribute('aria-label','Swap '+m.name);sw.innerHTML=SWAPICO;sw.onclick=()=>{swapMove(WK,ci,idx);renderPreview();};
      row.appendChild(sw);card.appendChild(row);
    });
    body.appendChild(card);
  });
  const csum=wk.cool.reduce((a,x)=>a+x.dur,0);
  body.insertAdjacentHTML('beforeend','<div class="sec-h"><h2>Cool-down</h2><span>'+fmt(csum)+'</span></div>');
  const cc2=document.createElement('div');cc2.className='card';cc2.style.padding='4px 12px';
  wk.cool.forEach(x=>cc2.insertAdjacentHTML('beforeend','<div class="simple"><span>'+ALL[x.id].name+(x.side?' ('+(x.side==='L'?'left':'right')+')':'')+'</span><span>'+x.dur+'s</span></div>'));body.appendChild(cc2);
  const total=sequence(wk).reduce((a,s)=>a+s.dur,0);
  body.insertAdjacentHTML('beforeend','<p class="sub" style="margin-top:14px;text-align:center">Total '+fmt(total)+'. Tap a move to see how it\'s done, or swap it.</p>');
}

function renderHistory(){
  const h=store.get('history',[]);
  const weekAgo=Date.now()-7*864e5;
  const wkN=h.filter(e=>new Date(e.date).getTime()>weekAgo).length;
  const mins=Math.round(h.reduce((a,e)=>a+(e.secs||0),0)/60);
  $('h-stats').innerHTML='<div class="stat"><b>'+h.length+'</b><small>Sessions</small></div><div class="stat"><b>'+wkN+'</b><small>This week</small></div><div class="stat"><b>'+mins+'</b><small>Minutes</small></div>';
  const list=$('h-list');
  if(!h.length){list.innerHTML='<div class="empty">No workouts yet. Your finished sessions will show up here.</div>';return;}
  list.innerHTML=h.map(e=>{const d=new Date(e.date);
    return '<div class="card hist"><div class="top"><b>'+FOCUSNAME[e.focus]+' · '+fmtMin(e.secs)+(e.complete?'':' <span class="tag">ended early</span>')+'</b><small>'+d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</small></div><p>'+e.work+'/'+e.rest+' · '+(e.diff?DIFFS.find(d=>d[0]===e.diff)[1]+' · ':'')+(e.moves||[]).map(id=>ALL[id]?ALL[id].name:id).join(', ')+'</p></div>';}).join('');
}
$('b-clear').onclick=()=>{
  openSheet('<h3>Clear history?</h3><p class="sub">This deletes every saved workout on this phone. Move variety will start fresh.</p><div class="row"><button class="btn sec" id="cx">Cancel</button><button class="btn" id="cy">Clear</button></div>');
  $('cx').onclick=closeSheet;$('cy').onclick=()=>{store.set('history',[]);closeSheet();renderHistory();};
};

/* ================= Player ================= */
const PL={seq:[],i:0,left:0,running:false,last:0,timer:0,doneSecs:0,wake:null,lastWhole:null};
const KIND={ready:'Get ready',warm:'Warm-up',work:'Work',rest:'Rest',round:'Round rest',set:'Get set',cool:'Cool-down'};
let SPEED=1;
async function wakeOn(){try{if('wakeLock' in navigator){PL.wake=await navigator.wakeLock.request('screen');}}catch(e){}}
function wakeOff(){try{if(PL.wake){PL.wake.release();PL.wake=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('player').classList.contains('show')&&PL.running)wakeOn();});
const sideWord=s=>s==='L'?'left side':s==='R'?'right side':'';
function nameWithSide(it){if(!it)return '';const m=ALL[it.id];return m.name+(it.side?', '+sideWord(it.side):'');}
function startWorkout(){
  initAudio();
  PL.seq=sequence(WK);PL.i=0;PL.doneSecs=0;PL.startedAt=Date.now();PL.total=PL.seq.reduce((a,s)=>a+s.dur,0);
  $('player').classList.add('show');document.body.style.overflow='hidden';
  wakeOn();enter(0);resume();
}
function enter(i){
  PL.i=i;const it=PL.seq[i];PL.left=it.dur;PL.lastWhole=Math.ceil(it.dur);PL.stepKey=-1;
  const pl=$('player');pl.className='show k-'+it.k;
  $('p-phase').textContent=KIND[it.k]+(it.k==='warm'||it.k==='cool'?' '+it.n+'/'+it.of:'');
  // what to show: the move for work/warm/cool, the upcoming move for rests
  const showIt=it.id?it:it.next;const m=showIt?ALL[showIt.id]:null;
  const isRest=!it.id;
  $('p-name').textContent=m?(isRest?'Next: ':'')+m.name:'';
  const sd=$('p-side');if(showIt&&showIt.side){sd.textContent=showIt.side==='L'?'LEFT':'RIGHT';sd.classList.remove('hide');}else sd.classList.add('hide');
  const fig=$('p-fig');if(m){fig.style.visibility='visible';animate(fig,m,{near:'#ffffff',bell:it.k==='work'?'#ffd166':'#ff9a5c',ground:'rgba(255,255,255,.35)',clock:it.k==='work'?workClock:null,trail:1});}else{fig.style.visibility='hidden';stopAnim(fig);}
  $('p-cues').innerHTML=m?(m.calls?'<div class="steps">'+m.calls.map(c=>'<span>'+c[1]+'</span>').join('')+'</div>':'')+m.cues.slice(0,m.calls?2:3).map(c=>'<div>'+c+'</div>').join(''):'';
  const nx=it.next;
  $('p-next').textContent=(!isRest&&nx&&it.k!=='ready')?'Then: '+nameWithSide(nx):'';
  const where=it.circ!=null?'Circuit '+LETTER[it.circ]+' · Round '+it.round+'/'+it.rounds:KIND[it.k];
  $('p-where').textContent=where;PL.where=where;
  announce(it);
  updateTime();
}
// Seconds into the current interval, smoothed between timer ticks. Drives the figure during work so it matches the voice and stops on pause.
function workClock(){const it=PL.seq[PL.i];return Math.max(0,it.dur-PL.left+(PL.running?(performance.now()-PL.last)/1000*SPEED:0));}
// Which step of a complex the figure is on at t seconds: n = rep number, idx = index into m.calls
function stepAt(m,t){
  const tot=m.kf.reduce((a,f)=>a+f[1],0), n=Math.floor(t/tot), tt=t-n*tot;
  let acc=0,idx=0;const starts=m.kf.map(f=>{const s=acc;acc+=f[1];return s;});
  m.calls.forEach((c,i)=>{if(starts[c[0]]<=tt+1e-6)idx=i;});
  return {n,idx};
}
function stepCall(it){
  const m=ALL[it.id];if(!m.calls)return;
  const st=stepAt(m,Math.max(0,it.dur-PL.left)), key=st.n*100+st.idx;
  if(key===PL.stepKey)return;PL.stepKey=key;
  $('p-cues').querySelectorAll('.steps span').forEach((e,i)=>e.classList.toggle('on',i===st.idx));
  if(settings.cxVoice==='step'&&PL.left>3)say(m.calls[st.idx][1],true);
}
function announce(it){
  const nx=it.next;
  switch(it.k){
    case 'ready':say('Get ready. First up, '+nameWithSide(it));break;
    case 'warm':if(it.n>1)say(nameWithSide(it));break;
    case 'set':say('Warm-up done. Circuit A. First up, '+nameWithSide(nx));break;
    case 'work':beep(1175,.45,.4);break;
    case 'rest':say('Rest. Next, '+nameWithSide(nx));break;
    case 'round':{
      let t;if(it.newCirc)t='Circuit '+LETTER[it.circ]+' done. Rest '+it.dur+' seconds. Next, circuit '+LETTER[it.circ+1]+'. First up, '+nameWithSide(nx);
      else{t='Round '+it.round+' done. Rest '+it.dur+' seconds. '+(it.round+1===it.rounds?'Last round. ':'')+(it.up?'The moves step up. ':'')+'First up, '+nameWithSide(nx);}
      say(t);break;}
    case 'cool':say(it.n===1?'Great work. Cool-down. '+nameWithSide(it):nameWithSide(it));break;
  }
}
function updateTime(){
  const it=PL.seq[PL.i];$('p-time').textContent=fmt(Math.ceil(PL.left-1e-6));
  const done=PL.seq.slice(0,PL.i).reduce((a,s)=>a+s.dur,0)+(it.dur-PL.left);
  $('p-prog').style.width=(100*done/PL.total).toFixed(2)+'%';
  $('p-left').textContent='\u00a0· '+fmt(PL.total-done)+' left';
}
function loop(){
  if(!PL.running)return;
  const now=performance.now();const dt=(now-PL.last)/1000*SPEED;PL.last=now;
  PL.left-=dt;PL.doneSecs+=dt;
  const it=PL.seq[PL.i];const whole=Math.ceil(PL.left);
  if(whole<PL.lastWhole){
    PL.lastWhole=whole;
    if(it.k==='work'&&whole===10&&it.dur>=25)beep(660,.12,.25),setTimeout(()=>beep(660,.12,.25),180/SPEED);
    if(whole>=1&&whole<=3)beep(880,.14,.35);
  }
  if(it.k==='work'&&PL.left>0)stepCall(it);
  if(PL.left<=0){
    if(it.k==='work')beep(520,.5,.4);
    if(PL.i+1>=PL.seq.length){finish(true);return;}
    const carry=PL.left;enter(PL.i+1);PL.left+=carry;
  }
  updateTime();
}
function resume(){PL.running=true;PL.last=performance.now();clearInterval(PL.timer);PL.timer=setInterval(loop,100);setPauseIcon();}
function pause(){PL.running=false;clearInterval(PL.timer);setPauseIcon();try{speechSynthesis.cancel();}catch(e){}}
function setPauseIcon(){$('ico-pause').innerHTML=PL.running?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';$('b-pause').setAttribute('aria-label',PL.running?'Pause':'Resume');}
$('b-pause').onclick=()=>{initAudio();PL.running?pause():resume();};
$('b-next').onclick=()=>{if(PL.i+1>=PL.seq.length){finish(true);return;}enter(PL.i+1);};
$('b-prev').onclick=()=>{const it=PL.seq[PL.i];if(it.dur-PL.left>3||PL.i===0){enter(PL.i);}else enter(PL.i-1);};
$('b-end').onclick=()=>{
  const was=PL.running;pause();
  openSheet('<h3>End workout?</h3><p class="sub">You\'ve done '+fmt(PL.doneSecs)+'. It will be saved to your history as ended early.</p><div class="row"><button class="btn sec" id="ex">Keep going</button><button class="btn" id="ey">End and save</button></div><button class="link" id="ez">Discard without saving</button>');
  $('ex').onclick=()=>{closeSheet();if(was)resume();};
  $('ey').onclick=()=>{closeSheet();finish(false);};
  $('ez').onclick=()=>{closeSheet();quitPlayer();show('setup');};
};
function quitPlayer(){pause();wakeOff();stopAnim($('p-fig'));$('player').classList.remove('show');document.body.style.overflow='';}
function finish(complete){
  quitPlayer();
  const doneWork=PL.seq.slice(0,complete?PL.seq.length:PL.i).filter(s=>s.k==='work');
  const ids=[...new Set(doneWork.map(s=>s.id))];
  const entry={date:new Date().toISOString(),mins:WK.cfg.mins,secs:Math.round(complete?PL.total:PL.doneSecs),focus:WK.cfg.focus,work:WK.cfg.work,rest:WK.cfg.rest,moves:ids,diff:WK.cfg.diff,complete};
  if(entry.secs>=60){const h=store.get('history',[]);h.unshift(entry);store.set('history',h.slice(0,200));}
  if(complete)say('Workout complete. Nice work.');
  $('d-title').textContent=complete?'Workout complete':'Workout saved';
  $('d-sub').textContent=FOCUSNAME[WK.cfg.focus]+' · '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  $('d-stats').innerHTML='<div class="stat"><b>'+fmt(entry.secs)+'</b><small>Time</small></div><div class="stat"><b>'+doneWork.length+'</b><small>Work sets</small></div><div class="stat"><b>'+Math.round(doneWork.length*WK.cfg.work/60)+'</b><small>Work min</small></div>';
  $('d-moves').innerHTML=(entry.moves.length?entry.moves:['—']).map(id=>'<div class="simple"><span>'+(ALL[id]?ALL[id].name:id)+'</span><span>'+(ALL[id]&&ALL[id].uni?'L + R':'')+'</span></div>').join('');
  show('done');
}
$('b-start').onclick=startWorkout;
$('b-done').onclick=()=>show('history');

/* expose for testing */
window.KB={MOVES,WARM,COOL,ALL,buildWorkout,sequence,fitPlan,fk,setSpeed:s=>SPEED=s,PL,poseAt,makeFig,swapMove,stepAt,settings};
renderSetup();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');}catch(e){}
</script>
